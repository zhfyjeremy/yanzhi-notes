# Desktop packaging for Win/macOS (manual Run workflow or v* tags).
# Touch this file when Actions list is empty so GitHub re-registers the workflow.
name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            os: macos-15
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
          - platform: windows-x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install Rust targets
        run: rustup target add ${{ matrix.rust-targets }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS universal app
        if: matrix.platform == 'macos-universal'
        env:
          # CI=true makes the bundler skip the Finder layout, so the DMG opens as a plain folder and the app runs in place.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        # Keep the app-level ad-hoc signature in tauri.conf.json; --no-sign leaves only a linker signature, so macOS TCC cannot persist folder access grants.
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Build Windows x64 app
        if: matrix.platform == 'windows-x64'
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows-portable.ps1

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-universal'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-windows/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate-release-notes: true
